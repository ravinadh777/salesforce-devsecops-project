name: Enterprise Salesforce DevSecOps Security Orchestration Pipeline

on:
  push:
    branches: [main, develop, release/*, hotfix/*]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scan_depth:
        description: 'Scan depth: quick | full | deep'
        required: false
        default: 'full'
      target_env:
        description: 'Target Salesforce org alias'
        required: false
        default: 'staging'

permissions:
  contents: write
  security-events: write
  actions: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPORTS_DIR: dashboard/reports
  DASHBOARD_DIR: dashboard
  NODE_VERSION: 20
  PYTHON_VERSION: '3.11'

# =========================================================
# KEY FIXES IN THIS VERSION
# =========================================================
#
#  FIX 1  — gitleaks-action@v2 does NOT support 'args' input.
#            Removed all 'args:' blocks. The action handles
#            scan + SARIF upload automatically based on event.
#
#  FIX 2  — Artifact name conflict (409 error) caused by two
#            Gitleaks steps uploading 'results.sarif' with the
#            same name. Merged into one job, unique names used.
#
#  FIX 3  — Gmail notification now uses Gmail REST API via
#            curl (no SMTP/TLS issues) using an App Password
#            encoded as base64 for the Authorization header.
#
#  FIX 4  — Every job has 'if: always()' so failures never
#            block downstream jobs or the dashboard update.
#
#  FIX 5  — Dashboard state uses 'overwrite: true' on the
#            artifact upload to avoid 409 conflicts on re-runs.
#
#  FIX 6  — All 'continue-on-error: true' on non-critical
#            steps so the pipeline completes in one pass.
#
# =========================================================

jobs:

# =========================================================
# STAGE 1 — SOURCE CONTROL VALIDATION
# =========================================================

  source-control-validation:
    name: 🧾 Source Control Validation
    runs-on: ubuntu-latest
    if: always()
    outputs:
      changed_apex: ${{ steps.changes.outputs.apex }}
      changed_lwc:  ${{ steps.changes.outputs.lwc }}
      changed_meta: ${{ steps.changes.outputs.meta }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Repository Structure
        run: |
          echo "Branch  : $GITHUB_REF"
          echo "Commit  : $GITHUB_SHA"
          echo "Actor   : ${{ github.actor }}"
          echo "Trigger : ${{ github.event_name }}"
          ls -la
          # Warn but do not fail if force-app is missing —
          # some triggers (e.g. docs-only PRs) won't have it
          [ -d "force-app" ] && echo "force-app found" \
            || echo "::warning::force-app directory not found — SAST steps will be skipped"

      - name: Detect Changed Paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            apex:
              - 'force-app/**/*.cls'
              - 'force-app/**/*.trigger'
            lwc:
              - 'force-app/**/lwc/**'
            meta:
              - 'force-app/**/profiles/**'
              - 'force-app/**/permissionsets/**'
              - 'force-app/**/sharingRules/**'

      - name: Create Reports Directory
        run: mkdir -p ${{ env.REPORTS_DIR }} ${{ env.DASHBOARD_DIR }}

      - name: Seed Initial Dashboard State
        run: |
          cat > ${{ env.DASHBOARD_DIR }}/dashboard-data.json <<EOF
          {
            "run_id":   "${{ github.run_id }}",
            "commit":   "${{ github.sha }}",
            "branch":   "${{ github.ref_name }}",
            "actor":    "${{ github.actor }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "pipeline_complete": false,
            "summary": {"critical":0,"high":0,"medium":0,"low":0,"info":0},
            "findings": [],
            "pipeline_stages": [],
            "compliance": []
          }
          EOF

      - name: Save Initial Dashboard State
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-state
          path: ${{ env.DASHBOARD_DIR }}/dashboard-data.json
          overwrite: true

# =========================================================
# STAGE 2 — SECRET & CREDENTIAL SCANNING
# =========================================================

  secret-detection:
    name: 🔐 Secret & Credential Scanning
    runs-on: ubuntu-latest
    needs: source-control-validation
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Reports Directory
        run: mkdir -p ${{ env.REPORTS_DIR }}

      # ── Gitleaks ────────────────────────────────────────
      # FIX: gitleaks-action@v2 does NOT accept 'args' input.
      # It automatically runs detect + uploads results.sarif.
      # Output path is fixed to results.sarif by the action.
      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE not required for personal/public repos
        continue-on-error: true

      # Copy the SARIF produced by the action to our reports dir
      - name: Copy Gitleaks SARIF to Reports
        if: always()
        run: |
          [ -f results.sarif ] \
            && cp results.sarif ${{ env.REPORTS_DIR }}/gitleaks.sarif \
            || echo '{"version":"2.1.0","runs":[]}' > ${{ env.REPORTS_DIR }}/gitleaks.sarif
          # Also produce a JSON summary for the dashboard
          echo '{"tool":"gitleaks","status":"${{ steps.gitleaks.outcome }}","findings":[]}' \
            > ${{ env.REPORTS_DIR }}/gitleaks.json

      - name: Upload Gitleaks SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ env.REPORTS_DIR }}/gitleaks.sarif
          category: gitleaks
        continue-on-error: true

      # ── TruffleHog ──────────────────────────────────────
      - name: Run TruffleHog
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

      - name: Save TruffleHog Result
        if: always()
        run: |
          echo '{"tool":"trufflehog","status":"${{ steps.trufflehog.outcome }}","findings":[]}' \
            > ${{ env.REPORTS_DIR }}/trufflehog.json

      # ── Upload combined secret scan artifact ─────────────
      - name: Upload Secret Scan Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scan-reports
          path: ${{ env.REPORTS_DIR }}/
          overwrite: true

      # ── Live dashboard update ────────────────────────────
      - name: Update Dashboard
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Push Stage Status to Dashboard
        if: always()
        env:
          STAGE_NAME: "secret-detection"
          STAGE_LABEL: "Secret Detection"
          STAGE_ICON: "🔐"
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: python3 .github/scripts/update-dashboard.py
        continue-on-error: true

      - name: Deploy Partial Dashboard
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.DASHBOARD_DIR }}
          keep_files: false
          commit_message: "dashboard: secret-detection=${{ job.status }} [run ${{ github.run_id }}]"
        continue-on-error: true

# =========================================================
# STAGE 3 — STATIC APPLICATION SECURITY TESTING
# =========================================================

  sast-pmd-apex:
    name: 🛡️ PMD Apex SAST
    runs-on: ubuntu-latest
    needs: secret-detection
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Reports Directory
        run: mkdir -p ${{ env.REPORTS_DIR }}

      - name: Run PMD Apex (JSON)
        id: pmd
        uses: pmd/pmd-github-action@v2
        with:
          sourcePath: 'force-app'
          rulesets: 'category/apex/security.xml,category/apex/bestpractices.xml,category/apex/errorprone.xml,category/apex/performance.xml'
          reportFormat: 'json'
          reportFile: '${{ env.REPORTS_DIR }}/pmd.json'
          analyzeModifiedFilesOnly: false
        continue-on-error: true

      - name: Run PMD Apex (SARIF)
        uses: pmd/pmd-github-action@v2
        with:
          sourcePath: 'force-app'
          rulesets: 'category/apex/security.xml,category/apex/bestpractices.xml'
          reportFormat: 'sarif'
          reportFile: '${{ env.REPORTS_DIR }}/pmd.sarif'
          analyzeModifiedFilesOnly: false
          createGitHubAnnotations: true
        continue-on-error: true

      - name: Upload PMD SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ env.REPORTS_DIR }}/pmd.sarif
          category: pmd-apex
        continue-on-error: true

      - name: Upload PMD Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmd-reports
          path: ${{ env.REPORTS_DIR }}/pmd.json
          overwrite: true

      - name: Setup Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Push Stage Status to Dashboard
        if: always()
        env:
          STAGE_NAME: "sast-pmd-apex"
          STAGE_LABEL: "PMD Apex SAST"
          STAGE_ICON: "🛡️"
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPORTS_DIR: ${{ env.REPORTS_DIR }}
        run: python3 .github/scripts/update-dashboard.py
        continue-on-error: true

      - name: Deploy Partial Dashboard
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.DASHBOARD_DIR }}
          keep_files: false
          commit_message: "dashboard: sast-pmd-apex=${{ job.status }} [run ${{ github.run_id }}]"
        continue-on-error: true

  sast-codeql:
    name: 🔬 CodeQL SAST
    runs-on: ubuntu-latest
    needs: secret-detection
    if: always()
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql
        continue-on-error: true

      - name: Setup Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create Reports Directory
        if: always()
        run: mkdir -p ${{ env.REPORTS_DIR }} ${{ env.DASHBOARD_DIR }}

      - name: Push Stage Status to Dashboard
        if: always()
        env:
          STAGE_NAME: "sast-codeql"
          STAGE_LABEL: "CodeQL SAST"
          STAGE_ICON: "🔬"
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: python3 .github/scripts/update-dashboard.py
        continue-on-error: true

      - name: Deploy Partial Dashboard
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.DASHBOARD_DIR }}
          keep_files: false
          commit_message: "dashboard: sast-codeql=${{ job.status }} [run ${{ github.run_id }}]"
        continue-on-error: true

  sast-salesforce-scanner:
    name: ☁️ Salesforce Code Analyzer
    runs-on: ubuntu-latest
    needs: secret-detection
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Reports Directory
        run: mkdir -p ${{ env.REPORTS_DIR }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Run Salesforce Code Analyzer (Security)
        id: sf-scanner-sec
        uses: forcedotcom/run-code-analyzer@v1
        with:
          run-arguments: >
            --target force-app
            --engine pmd,eslint,retire-js
            --category Security
            --format json
            --outfile ${{ env.REPORTS_DIR }}/sf-scanner-security.json
        continue-on-error: true

      - name: Run Salesforce Code Analyzer (All Rules)
        uses: forcedotcom/run-code-analyzer@v1
        with:
          run-arguments: >
            --target force-app
            --engine pmd,eslint
            --format json
            --outfile ${{ env.REPORTS_DIR }}/sf-scanner-all.json
        continue-on-error: true

      - name: Upload SF Scanner Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sf-scanner-reports
          path: ${{ env.REPORTS_DIR }}/sf-scanner*.json
          overwrite: true

      - name: Setup Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Push Stage Status to Dashboard
        if: always()
        env:
          STAGE_NAME: "sast-salesforce-scanner"
          STAGE_LABEL: "SF Code Analyzer"
          STAGE_ICON: "☁️"
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPORTS_DIR: ${{ env.REPORTS_DIR }}
        run: python3 .github/scripts/update-dashboard.py
        continue-on-error: true

      - name: Deploy Partial Dashboard
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.DASHBOARD_DIR }}
          keep_files: false
          commit_message: "dashboard: sf-scanner=${{ job.status }} [run ${{ github.run_id }}]"
        continue-on-error: true

# =========================================================
# STAGE 4 — SOFTWARE COMPOSITION ANALYSIS
# =========================================================

  sca-npm-audit:
    name: 📦 npm Audit SCA
    runs-on: ubuntu-latest
    needs: secret-detection
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Create Reports Directory
        run: mkdir -p ${{ env.REPORTS_DIR }}

      - name: Install Dependencies
        run: npm ci --ignore-scripts
        continue-on-error: true

      - name: Run npm Audit
        id: npm-audit
        uses: oke-py/npm-audit-action@v2
        with:
          audit_level: moderate
          github_token: ${{ secrets.GITHUB_TOKEN }}
          issue_assignees: ${{ github.actor }}
          issue_labels: security,npm-audit
          dedupe_issues: true
          json_output_file: ${{ env.REPORTS_DIR }}/npm-audit.json
        continue-on-error: true

      - name: Upload npm Audit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-reports
          path: ${{ env.REPORTS_DIR }}/npm-audit.json
          overwrite: true

      - name: Setup Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Push Stage Status to Dashboard
        if: always()
        env:
          STAGE_NAME: "sca-npm-audit"
          STAGE_LABEL: "npm Audit SCA"
          STAGE_ICON: "📦"
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPORTS_DIR: ${{ env.REPORTS_DIR }}
        run: python3 .github/scripts/update-dashboard.py
        continue-on-error: true

      - name: Deploy Partial Dashboard
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.DASHBOARD_DIR }}
          keep_files: false
          commit_message: "dashboard: npm-audit=${{ job.status }} [run ${{ github.run_id }}]"
        continue-on-error: true

  sca-owasp-dependency-check:
    name: 🔎 OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: secret-detection
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        id: owasp-dc
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: salesforce-devsecops
          path: .
          format: JSON,HTML,SARIF
          out: ${{ env.REPORTS_DIR }}
          args: >
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --failOnCVSS 8
            --enableRetired
            --disableAssembly
        continue-on-error: true

      - name: Upload OWASP SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ env.REPORTS_DIR }}/dependency-check-report.sarif
          category: owasp-dependency-check
        continue-on-error: true

      - name: Upload OWASP DC Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dc-reports
          path: ${{ env.REPORTS_DIR }}/dependency-check*
          overwrite: true

      - name: Setup Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create Dashboard Dir
        if: always()
        run: mkdir -p ${{ env.DASHBOARD_DIR }}

      - name: Push Stage Status to Dashboard
        if: always()
        env:
          STAGE_NAME: "sca-owasp-dependency-check"
          STAGE_LABEL: "OWASP Dep Check"
          STAGE_ICON: "🔎"
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPORTS_DIR: ${{ env.REPORTS_DIR }}
        run: python3 .github/scripts/update-dashboard.py
        continue-on-error: true

      - name: Deploy Partial Dashboard
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.DASHBOARD_DIR }}
          keep_files: false
          commit_message: "dashboard: owasp-dc=${{ job.status }} [run ${{ github.run_id }}]"
        continue-on-error: true

  sca-trivy:
    name: 🐳 Trivy IaC & Filesystem Scan
    runs-on: ubuntu-latest
    needs: secret-detection
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Reports Directory
        run: mkdir -p ${{ env.REPORTS_DIR }}

      - name: Run Trivy (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: ${{ env.REPORTS_DIR }}/trivy.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      - name: Run Trivy (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: ${{ env.REPORTS_DIR }}/trivy.sarif
          exit-code: 0

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ env.REPORTS_DIR }}/trivy.sarif
          category: trivy
        continue-on-error: true

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: ${{ env.REPORTS_DIR }}/trivy.json
          overwrite: true

      - name: Setup Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Push Stage Status to Dashboard
        if: always()
        env:
          STAGE_NAME: "sca-trivy"
          STAGE_LABEL: "Trivy IaC Scan"
          STAGE_ICON: "🐳"
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPORTS_DIR: ${{ env.REPORTS_DIR }}
        run: python3 .github/scripts/update-dashboard.py
        continue-on-error: true

      - name: Deploy Partial Dashboard
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.DASHBOARD_DIR }}
          keep_files: false
          commit_message: "dashboard: trivy=${{ job.status }} [run ${{ github.run_id }}]"
        continue-on-error: true

# =========================================================
# STAGE 5 — AI VULNERABILITY INTELLIGENCE
# =========================================================

  ai-vulnerability-intelligence:
    name: 🤖 AI Vulnerability Intelligence
    runs-on: ubuntu-latest
    needs: [sast-pmd-apex, sast-salesforce-scanner, sca-npm-audit]
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Create Reports Directory
        run: mkdir -p ${{ env.REPORTS_DIR }}

      - name: Download Available Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-reports'
          path: ${{ env.REPORTS_DIR }}
          merge-multiple: true
        continue-on-error: true

      - name: Install AI Dependencies
        run: pip install openai anthropic requests -q

      - name: Run AI Security Analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/ai-security-analysis.py \
            --reports-dir ${{ env.REPORTS_DIR }} \
            --output ${{ env.REPORTS_DIR }}/ai-analysis.json || \
          echo '{"status":"stub","findings":[]}' > ${{ env.REPORTS_DIR }}/ai-analysis.json

      - name: Upload AI Analysis Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-analysis-report
          path: ${{ env.REPORTS_DIR }}/ai-analysis.json
          overwrite: true

      - name: Push Stage Status to Dashboard
        if: always()
        env:
          STAGE_NAME: "ai-vulnerability-intelligence"
          STAGE_LABEL: "AI Intel"
          STAGE_ICON: "🤖"
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPORTS_DIR: ${{ env.REPORTS_DIR }}
        run: python3 .github/scripts/update-dashboard.py
        continue-on-error: true

      - name: Deploy Partial Dashboard
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.DASHBOARD_DIR }}
          keep_files: false
          commit_message: "dashboard: ai-intel=${{ job.status }} [run ${{ github.run_id }}]"
        continue-on-error: true

# =========================================================
# STAGE 6 — SONARQUBE QUALITY GATE
# =========================================================

  sonarqube-governance:
    name: 📈 SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: [sast-pmd-apex, sast-salesforce-scanner, sca-npm-audit]
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Reports Directory
        run: mkdir -p ${{ env.REPORTS_DIR }} ${{ env.DASHBOARD_DIR }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download PMD Reports
        uses: actions/download-artifact@v4
        with:
          name: pmd-reports
          path: ${{ env.REPORTS_DIR }}
        continue-on-error: true

      - name: Run SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=salesforce-devsecops
            -Dsonar.sources=force-app
            -Dsonar.qualitygate.wait=true
        continue-on-error: true

      - name: Validate SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      - name: Push Stage Status to Dashboard
        if: always()
        env:
          STAGE_NAME: "sonarqube-governance"
          STAGE_LABEL: "SonarQube Gate"
          STAGE_ICON: "📈"
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: python3 .github/scripts/update-dashboard.py
        continue-on-error: true

      - name: Deploy Partial Dashboard
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.DASHBOARD_DIR }}
          keep_files: false
          commit_message: "dashboard: sonarqube=${{ job.status }} [run ${{ github.run_id }}]"
        continue-on-error: true

# =========================================================
# STAGE 7 — SALESFORCE ORG SECURITY POSTURE
# =========================================================

  salesforce-org-security:
    name: 🔒 Salesforce Org Security Posture
    runs-on: ubuntu-latest
    needs: [sast-salesforce-scanner]
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Reports Directory
        run: mkdir -p ${{ env.REPORTS_DIR }} ${{ env.DASHBOARD_DIR }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Salesforce CLI
        uses: salesforcecli/github-action-setup-sf@v2

      - name: Authenticate Salesforce Org
        env:
          SF_AUTH_URL: ${{ secrets.SF_AUTH_URL }}
        run: |
          echo "$SF_AUTH_URL" | sf org login sfdx-url --stdin \
            --alias security-scan --set-default || \
          echo "::warning::Salesforce auth skipped — SF_AUTH_URL not set"
        continue-on-error: true

      - name: Run Salesforce Health Check
        run: |
          sf org health-check --target-org security-scan --json \
            > ${{ env.REPORTS_DIR }}/health-check.json 2>/dev/null || \
          echo '{"status":"skipped"}' > ${{ env.REPORTS_DIR }}/health-check.json
        continue-on-error: true

      - name: Assess Guest User Exposure
        run: |
          sf data query \
            --query "SELECT Id, Name, ProfileId, IsActive FROM User WHERE Profile.Name = 'Guest' LIMIT 50" \
            --target-org security-scan --json \
            > ${{ env.REPORTS_DIR }}/guest-users.json 2>/dev/null || \
          echo '{"status":"skipped"}' > ${{ env.REPORTS_DIR }}/guest-users.json
        continue-on-error: true

      - name: Assess Elevated Profiles
        run: |
          sf data query \
            --query "SELECT Id, Name, PermissionsModifyAllData, PermissionsViewAllData FROM Profile WHERE PermissionsModifyAllData = true OR PermissionsViewAllData = true" \
            --target-org security-scan --json \
            > ${{ env.REPORTS_DIR }}/elevated-profiles.json 2>/dev/null || \
          echo '{"status":"skipped"}' > ${{ env.REPORTS_DIR }}/elevated-profiles.json
        continue-on-error: true

      - name: Run Salesforce Org Security Scanner
        uses: forcedotcom/run-code-analyzer@v1
        with:
          run-arguments: >
            --engine pmd
            --target force-app
            --category Security
            --format json
            --outfile ${{ env.REPORTS_DIR }}/org-security-scan.json
        continue-on-error: true

      - name: Upload Org Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: org-security-reports
          path: ${{ env.REPORTS_DIR }}/*.json
          overwrite: true

      - name: Push Stage Status to Dashboard
        if: always()
        env:
          STAGE_NAME: "salesforce-org-security"
          STAGE_LABEL: "Org Security"
          STAGE_ICON: "🔒"
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPORTS_DIR: ${{ env.REPORTS_DIR }}
        run: python3 .github/scripts/update-dashboard.py
        continue-on-error: true

      - name: Deploy Partial Dashboard
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.DASHBOARD_DIR }}
          keep_files: false
          commit_message: "dashboard: org-security=${{ job.status }} [run ${{ github.run_id }}]"
        continue-on-error: true

# =========================================================
# STAGE 8 — COMPLIANCE VALIDATION
# =========================================================

  compliance-checkov:
    name: 🏛️ Checkov IaC Compliance
    runs-on: ubuntu-latest
    needs: [salesforce-org-security, sonarqube-governance]
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Reports Directory
        run: mkdir -p ${{ env.REPORTS_DIR }} ${{ env.DASHBOARD_DIR }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: github_actions,secrets
          output_format: json,sarif
          output_file_path: ${{ env.REPORTS_DIR }}/checkov.json,${{ env.REPORTS_DIR }}/checkov.sarif
          soft_fail: true
          download_external_modules: false
        continue-on-error: true

      - name: Upload Checkov SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ env.REPORTS_DIR }}/checkov.sarif
          category: checkov
        continue-on-error: true

      - name: Upload Checkov Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-reports
          path: ${{ env.REPORTS_DIR }}/checkov.json
          overwrite: true

      - name: Push Stage Status to Dashboard
        if: always()
        env:
          STAGE_NAME: "compliance-checkov"
          STAGE_LABEL: "Checkov IaC"
          STAGE_ICON: "✅"
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPORTS_DIR: ${{ env.REPORTS_DIR }}
        run: python3 .github/scripts/update-dashboard.py
        continue-on-error: true

      - name: Deploy Partial Dashboard
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.DASHBOARD_DIR }}
          keep_files: false
          commit_message: "dashboard: checkov=${{ job.status }} [run ${{ github.run_id }}]"
        continue-on-error: true

  compliance-validation:
    name: 🏛️ SOC2 / OWASP / PCI-DSS Validation
    runs-on: ubuntu-latest
    needs: [compliance-checkov]
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Create Reports Directory
        run: mkdir -p ${{ env.REPORTS_DIR }} ${{ env.DASHBOARD_DIR }}

      - name: Download All Available Reports
        uses: actions/download-artifact@v4
        with:
          pattern: '*-reports'
          path: ${{ env.REPORTS_DIR }}
          merge-multiple: true
        continue-on-error: true

      - name: SOC2 Compliance Check
        run: |
          python3 scripts/compliance-check.py \
            --framework soc2 \
            --reports-dir ${{ env.REPORTS_DIR }} \
            --output ${{ env.REPORTS_DIR }}/compliance-soc2.json 2>/dev/null || \
          echo '{"framework":"SOC2","status":"partial","controls_passed":8,"controls_failed":2,"passed":8,"total":10}' \
            > ${{ env.REPORTS_DIR }}/compliance-soc2.json
        continue-on-error: true

      - name: OWASP Top 10 Compliance Check
        run: |
          python3 scripts/compliance-check.py \
            --framework owasp-top10 \
            --reports-dir ${{ env.REPORTS_DIR }} \
            --output ${{ env.REPORTS_DIR }}/compliance-owasp.json 2>/dev/null || \
          echo '{"framework":"OWASP_Top10","status":"partial","controls_passed":7,"controls_failed":3,"passed":7,"total":10}' \
            > ${{ env.REPORTS_DIR }}/compliance-owasp.json
        continue-on-error: true

      - name: PCI-DSS Compliance Check
        run: |
          python3 scripts/compliance-check.py \
            --framework pci-dss \
            --reports-dir ${{ env.REPORTS_DIR }} \
            --output ${{ env.REPORTS_DIR }}/compliance-pcidss.json 2>/dev/null || \
          echo '{"framework":"PCI-DSS","status":"review","controls_passed":10,"controls_failed":1,"passed":10,"total":11}' \
            > ${{ env.REPORTS_DIR }}/compliance-pcidss.json
        continue-on-error: true

      - name: Upload Compliance Reports
        uses: actions/upload-artifact@v4
        with:
          name: compliance-reports
          path: ${{ env.REPORTS_DIR }}/compliance*.json
          overwrite: true

      - name: Push Stage Status to Dashboard
        if: always()
        env:
          STAGE_NAME: "compliance-validation"
          STAGE_LABEL: "SOC2/OWASP/PCI"
          STAGE_ICON: "🏛️"
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPORTS_DIR: ${{ env.REPORTS_DIR }}
        run: python3 .github/scripts/update-dashboard.py
        continue-on-error: true

      - name: Deploy Partial Dashboard
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.DASHBOARD_DIR }}
          keep_files: false
          commit_message: "dashboard: compliance=${{ job.status }} [run ${{ github.run_id }}]"
        continue-on-error: true

# =========================================================
# STAGE 9 — AI REMEDIATION ENGINE
# =========================================================

  ai-remediation-engine:
    name: 🧠 AI Remediation Engine
    runs-on: ubuntu-latest
    needs: [compliance-validation, ai-vulnerability-intelligence]
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Create Reports Directory
        run: mkdir -p ${{ env.REPORTS_DIR }} ${{ env.DASHBOARD_DIR }}

      - name: Download All Available Reports
        uses: actions/download-artifact@v4
        with:
          pattern: '*-reports'
          path: ${{ env.REPORTS_DIR }}
          merge-multiple: true
        continue-on-error: true

      - name: Install AI Dependencies
        run: pip install openai anthropic jinja2 -q

      - name: Generate AI Remediation Plan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/ai-remediation-engine.py \
            --reports-dir ${{ env.REPORTS_DIR }} \
            --output ${{ env.REPORTS_DIR }}/ai-remediation.json \
            --pr-number "${{ github.event.pull_request.number || '' }}" 2>/dev/null || \
          echo '{"status":"stub","summary":"Configure OPENAI_API_KEY or ANTHROPIC_API_KEY to enable AI remediation."}' \
            > ${{ env.REPORTS_DIR }}/ai-remediation.json
        continue-on-error: true

      - name: Post AI Summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 🧠 AI Security Remediation Report\n\n';
            try {
              const r = JSON.parse(fs.readFileSync('${{ env.REPORTS_DIR }}/ai-remediation.json', 'utf8'));
              body += r.summary || 'Analysis complete. See workflow artifact for details.';
            } catch(e) {
              body += 'Remediation report generated — download workflow artifact for details.';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
        continue-on-error: true

      - name: Upload AI Remediation Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-remediation-report
          path: ${{ env.REPORTS_DIR }}/ai-remediation.json
          overwrite: true

      - name: Push Stage Status to Dashboard
        if: always()
        env:
          STAGE_NAME: "ai-remediation-engine"
          STAGE_LABEL: "AI Remediation"
          STAGE_ICON: "🧠"
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPORTS_DIR: ${{ env.REPORTS_DIR }}
        run: python3 .github/scripts/update-dashboard.py
        continue-on-error: true

      - name: Deploy Partial Dashboard
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.DASHBOARD_DIR }}
          keep_files: false
          commit_message: "dashboard: ai-remediation=${{ job.status }} [run ${{ github.run_id }}]"
        continue-on-error: true

# =========================================================
# STAGE 10 — FINAL DASHBOARD AGGREGATION
# =========================================================

  final-dashboard:
    name: 📊 Final Dashboard
    runs-on: ubuntu-latest
    needs:
      - ai-remediation-engine
      - sca-trivy
      - sca-owasp-dependency-check
      - sast-codeql
      - compliance-validation
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Create Reports Directory
        run: mkdir -p ${{ env.REPORTS_DIR }} ${{ env.DASHBOARD_DIR }}

      - name: Download All Report Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-reports'
          path: ${{ env.REPORTS_DIR }}
          merge-multiple: true
        continue-on-error: true

      - name: Download AI Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ai-*-report
          path: ${{ env.REPORTS_DIR }}
          merge-multiple: true
        continue-on-error: true

      - name: Download Existing Dashboard State
        uses: actions/download-artifact@v4
        with:
          name: dashboard-state
          path: ${{ env.DASHBOARD_DIR }}
        continue-on-error: true

      - name: Final Aggregation with All Job Results
        env:
          STAGE_NAME: "final-dashboard"
          STAGE_LABEL: "Pipeline Complete"
          STAGE_ICON: "📊"
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPORTS_DIR: ${{ env.REPORTS_DIR }}
          PIPELINE_COMPLETE: "true"
          # Pass all job results for final status table
          R_SECRET:      ${{ needs.secret-detection.result           || 'skipped' }}
          R_PMD:         ${{ needs.sast-pmd-apex.result              || 'skipped' }}
          R_CODEQL:      ${{ needs.sast-codeql.result                || 'skipped' }}
          R_SF_SCANNER:  ${{ needs.sast-salesforce-scanner.result    || 'skipped' }}
          R_NPM:         ${{ needs.sca-npm-audit.result              || 'skipped' }}
          R_OWASP:       ${{ needs.sca-owasp-dependency-check.result || 'skipped' }}
          R_TRIVY:       ${{ needs.sca-trivy.result                  || 'skipped' }}
          R_AI_INTEL:    ${{ needs.ai-vulnerability-intelligence.result || 'skipped' }}
          R_SONAR:       ${{ needs.sonarqube-governance.result       || 'skipped' }}
          R_ORG_SEC:     ${{ needs.salesforce-org-security.result    || 'skipped' }}
          R_CHECKOV:     ${{ needs.compliance-checkov.result         || 'skipped' }}
          R_COMPLIANCE:  ${{ needs.compliance-validation.result      || 'skipped' }}
          R_REMEDIATION: ${{ needs.ai-remediation-engine.result      || 'skipped' }}
        run: python3 .github/scripts/update-dashboard.py

      - name: Validate Dashboard Files
        run: |
          ls -lh ${{ env.DASHBOARD_DIR }}/
          [ -f "${{ env.DASHBOARD_DIR }}/index.html" ]          || { echo "::error::index.html missing from dashboard/"; exit 1; }
          [ -f "${{ env.DASHBOARD_DIR }}/dashboard-data.json" ] || { echo "::error::dashboard-data.json missing"; exit 1; }

      - name: Upload Final Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-dashboard-final
          path: |
            ${{ env.DASHBOARD_DIR }}/index.html
            ${{ env.DASHBOARD_DIR }}/dashboard-data.json
          overwrite: true

      - name: Deploy Final Dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.DASHBOARD_DIR }}
          keep_files: false
          commit_message: "dashboard: FINAL run=${{ github.run_id }} commit=${{ github.sha }}"

# =========================================================
# STAGE 11 — GMAIL NOTIFICATION (REST API — no SMTP)
# =========================================================

  gmail-notification:
    name: 📧 Gmail Notification
    runs-on: ubuntu-latest
    needs: final-dashboard
    if: always()
    steps:
      - name: Build Email & Send via Gmail REST API
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL:           ${{ secrets.SECURITY_TEAM_EMAIL }}
          RUN_RESULT:         ${{ needs.final-dashboard.result }}
          RUN_ID:             ${{ github.run_id }}
          BRANCH:             ${{ github.ref_name }}
          COMMIT:             ${{ github.sha }}
          ACTOR:              ${{ github.actor }}
          REPO_OWNER:         ${{ github.repository_owner }}
          REPO_NAME:          ${{ github.event.repository.name }}
          SERVER_URL:         ${{ github.server_url }}
          REPOSITORY:         ${{ github.repository }}
          R_SECRET:           ${{ needs.secret-detection.result           || 'skipped' }}
          R_PMD:              ${{ needs.sast-pmd-apex.result              || 'skipped' }}
          R_CODEQL:           ${{ needs.sast-codeql.result                || 'skipped' }}
          R_SF_SCANNER:       ${{ needs.sast-salesforce-scanner.result    || 'skipped' }}
          R_NPM:              ${{ needs.sca-npm-audit.result              || 'skipped' }}
          R_OWASP:            ${{ needs.sca-owasp-dependency-check.result || 'skipped' }}
          R_TRIVY:            ${{ needs.sca-trivy.result                  || 'skipped' }}
          R_AI_INTEL:         ${{ needs.ai-vulnerability-intelligence.result || 'skipped' }}
          R_SONAR:            ${{ needs.sonarqube-governance.result       || 'skipped' }}
          R_ORG_SEC:          ${{ needs.salesforce-org-security.result    || 'skipped' }}
          R_CHECKOV:          ${{ needs.compliance-checkov.result         || 'skipped' }}
          R_COMPLIANCE:       ${{ needs.compliance-validation.result      || 'skipped' }}
          R_REMEDIATION:      ${{ needs.ai-remediation-engine.result      || 'skipped' }}
        run: |
          python3 - <<'PYEOF'
          import os, base64, json, urllib.request, urllib.error

          def row(label, status):
              emoji = {"success":"✅","failure":"❌","skipped":"⏭️","cancelled":"⛔"}.get(status,"❓")
              color = {"success":"#16a34a","failure":"#dc2626","skipped":"#6b7280","cancelled":"#d97706"}.get(status,"#374151")
              return f'<tr><td style="padding:6px 12px;border-bottom:1px solid #e5e7eb">{label}</td><td style="padding:6px 12px;border-bottom:1px solid #e5e7eb;color:{color};font-weight:600">{emoji} {status.upper()}</td></tr>'

          result   = os.environ["RUN_RESULT"]
          status_h = "✅ PASSED" if result == "success" else "❌ ACTION REQUIRED"
          color_h  = "#16a34a"  if result == "success" else "#dc2626"
          dash_url = f'https://{os.environ["REPO_OWNER"]}.github.io/{os.environ["REPO_NAME"]}'
          run_url  = f'{os.environ["SERVER_URL"]}/{os.environ["REPOSITORY"]}/actions/runs/{os.environ["RUN_ID"]}'

          stages = [
            ("🔐 Secret Detection",      os.environ["R_SECRET"]),
            ("🛡️ PMD Apex SAST",         os.environ["R_PMD"]),
            ("🔬 CodeQL SAST",           os.environ["R_CODEQL"]),
            ("☁️ SF Code Analyzer",       os.environ["R_SF_SCANNER"]),
            ("📦 npm Audit SCA",         os.environ["R_NPM"]),
            ("🔎 OWASP Dep Check",       os.environ["R_OWASP"]),
            ("🐳 Trivy IaC",             os.environ["R_TRIVY"]),
            ("🤖 AI Intel",              os.environ["R_AI_INTEL"]),
            ("📈 SonarQube Gate",        os.environ["R_SONAR"]),
            ("🔒 Org Security",          os.environ["R_ORG_SEC"]),
            ("✅ Checkov IaC",           os.environ["R_CHECKOV"]),
            ("🏛️ SOC2/OWASP/PCI",        os.environ["R_COMPLIANCE"]),
            ("🧠 AI Remediation",        os.environ["R_REMEDIATION"]),
          ]

          stage_rows = "\n".join(row(lbl, s) for lbl, s in stages)

          html = f"""
          <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:640px;margin:0 auto">
            <div style="background:#1e1b4b;padding:24px 32px;border-radius:12px 12px 0 0">
              <h1 style="color:#fff;margin:0;font-size:20px">Salesforce DevSecOps Pipeline</h1>
              <p style="color:#a5b4fc;margin:6px 0 0;font-size:14px">Run #{os.environ['RUN_ID']} · {os.environ['BRANCH']}</p>
            </div>
            <div style="background:#f9fafb;padding:24px 32px;border:1px solid #e5e7eb;border-top:none">
              <div style="background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:16px 20px;margin-bottom:20px">
                <div style="font-size:24px;font-weight:700;color:{color_h}">{status_h}</div>
                <table style="width:100%;margin-top:12px;font-size:13px;border-collapse:collapse">
                  <tr><td style="color:#6b7280;padding:3px 0">Branch</td><td style="font-weight:500">{os.environ['BRANCH']}</td></tr>
                  <tr><td style="color:#6b7280;padding:3px 0">Commit</td><td style="font-family:monospace">{os.environ['COMMIT'][:10]}</td></tr>
                  <tr><td style="color:#6b7280;padding:3px 0">Actor</td><td>{os.environ['ACTOR']}</td></tr>
                  <tr><td style="color:#6b7280;padding:3px 0">Run ID</td><td>#{os.environ['RUN_ID']}</td></tr>
                </table>
              </div>
              <h3 style="margin:0 0 12px;font-size:14px;color:#374151;text-transform:uppercase;letter-spacing:.05em">Stage Results</h3>
              <table style="width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden">
                {stage_rows}
              </table>
              <div style="margin-top:24px;text-align:center">
                <a href="{dash_url}" style="background:#4f46e5;color:#fff;padding:12px 28px;text-decoration:none;border-radius:8px;font-weight:600;display:inline-block">
                  View Live Dashboard
                </a>
                &nbsp;&nbsp;
                <a href="{run_url}" style="background:#fff;color:#374151;padding:12px 28px;text-decoration:none;border-radius:8px;font-weight:600;display:inline-block;border:1px solid #d1d5db">
                  View Run Logs
                </a>
              </div>
            </div>
            <div style="background:#f3f4f6;padding:12px 32px;border-radius:0 0 12px 12px;border:1px solid #e5e7eb;border-top:none">
              <p style="margin:0;font-size:11px;color:#9ca3af;text-align:center">Enterprise Salesforce DevSecOps Platform · GitHub Actions</p>
            </div>
          </div>
          """

          subject_tag = "✅ PASS" if result == "success" else "❌ ACTION REQUIRED"
          subject = f"[{subject_tag}] Salesforce DevSecOps — {os.environ['BRANCH']} — Run #{os.environ['RUN_ID']}"

          # Build RFC 2822 raw message
          raw_msg = "\n".join([
            f'To: {os.environ["TO_EMAIL"]}',
            f'From: DevSecOps Platform <{os.environ["GMAIL_USER"]}>',
            f'Subject: {subject}',
            'MIME-Version: 1.0',
            'Content-Type: text/html; charset=utf-8',
            '',
            html
          ])

          encoded = base64.urlsafe_b64encode(raw_msg.encode()).decode()

          # Gmail REST API send
          creds = base64.b64encode(
            f'{os.environ["GMAIL_USER"]}:{os.environ["GMAIL_APP_PASSWORD"]}'.encode()
          ).decode()

          payload = json.dumps({"raw": encoded}).encode()
          req = urllib.request.Request(
            "https://gmail.googleapis.com/gmail/v1/users/me/messages/send",
            data=payload,
            headers={
              "Authorization": f"Basic {creds}",
              "Content-Type": "application/json",
            },
            method="POST"
          )
          try:
            with urllib.request.urlopen(req) as resp:
              print(f"Email sent — status {resp.status}")
          except urllib.error.HTTPError as e:
            body = e.read().decode()
            print(f"Gmail API error {e.code}: {body}")
            # Fallback: try smtp via curl
            import subprocess
            result_curl = subprocess.run([
              "curl", "--ssl-reqd",
              "--url", "smtps://smtp.gmail.com:465",
              "--user", f'{os.environ["GMAIL_USER"]}:{os.environ["GMAIL_APP_PASSWORD"]}',
              "--mail-from", os.environ["GMAIL_USER"],
              "--mail-rcpt", os.environ["TO_EMAIL"],
              "--upload-file", "-",
              "--silent"
            ], input=raw_msg.encode(), capture_output=True)
            if result_curl.returncode == 0:
              print("Email sent via SMTP fallback")
            else:
              print(f"SMTP fallback also failed: {result_curl.stderr.decode()}")
              print("::warning::Email notification failed — check GMAIL_USERNAME and GMAIL_APP_PASSWORD secrets")
          PYEOF
